spring.datasource.url=jdbc:h2:file:./target/test-data/edurepo;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
app.upload.dir=target/test-uploads
app.admin.email=
app.admin.password=
app.user.email=
app.user.password=
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=201MB
app.seed.sample-data=false
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.6-luna}
openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:45}
