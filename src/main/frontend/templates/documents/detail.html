<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Chi tiết tài liệu</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/header :: header}"></div><main class="content narrow"><a th:href="@{/documents}">← Danh sách tài liệu</a><p class="eyebrow" style="margin-top:1.5rem">Chi tiết tài liệu</p><h1 th:text="${document.title}"></h1><span class="badge" th:classappend="|status-${#strings.toLowerCase(document.status.name())}|" th:text="${document.status}"></span><p class="subtitle" style="margin-top:1.2rem" th:text="${document.description}"></p><dl><dt>Tệp đính kèm</dt><dd th:text="${document.fileName}"></dd><dt>Danh mục</dt><dd th:text="${document.category != null ? document.category.name : 'Chưa phân loại'}"></dd></dl><form th:if="${document.status.name() == 'DRAFT' or document.status.name() == 'REVISION_REQUIRED'}" th:action="@{/documents/{id}/submit(id=${document.id})}" method="post"><button type="submit">Gửi tài liệu để duyệt →</button></form></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
