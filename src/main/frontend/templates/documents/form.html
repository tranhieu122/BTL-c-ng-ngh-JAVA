<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Nộp tài liệu</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/header :: header}"></div><div class="page-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content narrow"><h1>Nộp tài liệu</h1><form th:action="@{/documents}" th:object="${documentForm}" method="post" enctype="multipart/form-data" class="form-grid"><label>Tiêu đề<input th:field="*{title}" required></label><small class="field-error" th:errors="*{title}"></small><label>Mô tả<textarea th:field="*{description}" rows="5"></textarea></label><label>Tác giả<input th:field="*{authorName}"></label><label>Danh mục<select th:field="*{categoryId}" required><option value="">-- Chọn --</option><option th:each="item : ${categories}" th:value="${item.id}" th:text="${item.name}"></option></select></label><label>Khoa/Bộ môn<select th:field="*{departmentId}"><option value="">-- Không chọn --</option><option th:each="item : ${departments}" th:value="${item.id}" th:text="${item.name}"></option></select></label><label>Tệp PDF/DOC/DOCX<input type="file" th:field="*{file}" accept=".pdf,.doc,.docx" required></label><small class="field-error" th:errors="*{file}"></small><button type="submit">Lưu bản nháp</button></form></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
