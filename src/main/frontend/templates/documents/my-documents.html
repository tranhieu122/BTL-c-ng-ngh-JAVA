<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Tài liệu của tôi</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/header :: header}"></div><div class="page-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><p class="eyebrow">Không gian cá nhân</p><div class="title-row"><div><h1>Tài liệu của tôi</h1><span class="subtitle">Theo dõi tài liệu đã nộp và tiến trình kiểm duyệt.</span></div><a class="button" th:href="@{/documents/new}">+ Nộp tài liệu</a></div><p class="alert success" th:if="${success}" th:text="${success}"></p><table th:if="${!#lists.isEmpty(documents)}"><thead><tr><th>Tiêu đề</th><th>Trạng thái</th><th>Ngày tạo</th><th></th></tr></thead><tbody><tr th:each="doc : ${documents}"><td th:text="${doc.title}"></td><td><span class="badge" th:classappend="|status-${#strings.toLowerCase(doc.status.name())}|" th:text="${doc.status}"></span></td><td th:text="${doc.createdAt}"></td><td><a th:href="@{/documents/{id}(id=${doc.id})}">Chi tiết →</a></td></tr></tbody></table><div class="empty-state" th:if="${#lists.isEmpty(documents)}"><h2>Bạn chưa có tài liệu</h2><p>Hãy bắt đầu bằng cách nộp tài liệu đầu tiên.</p></div></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
