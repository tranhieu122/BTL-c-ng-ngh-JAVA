<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Tài liệu chờ duyệt</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/header :: header}"></div><div class="page-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><h1>Tài liệu chờ duyệt</h1><p class="alert success" th:if="${success}" th:text="${success}"></p><table><thead><tr><th>Tiêu đề</th><th>Người nộp</th><th>Ngày gửi</th><th></th></tr></thead><tbody><tr th:each="doc : ${documents}"><td th:text="${doc.title}"></td><td th:text="${doc.createdBy.fullName}"></td><td th:text="${doc.submittedAt}"></td><td><a th:href="@{/reviews/{id}(id=${doc.id})}">Duyệt</a></td></tr></tbody></table><p th:if="${#lists.isEmpty(documents)}">Không có tài liệu đang chờ.</p></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
