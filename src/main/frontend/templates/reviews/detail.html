<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Duyệt tài liệu</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/header :: header}"></div><main class="content narrow"><a th:href="@{/reviews/pending}">← Danh sách chờ</a><h1 th:text="${document.title}"></h1><p th:text="${document.description}"></p><form th:action="@{/reviews/{id}(id=${document.id})}" th:object="${reviewForm}" method="post" class="form-grid"><label>Quyết định<select th:field="*{action}" required><option value="">-- Chọn --</option><option value="APPROVED">Phê duyệt</option><option value="REVISION_REQUESTED">Yêu cầu chỉnh sửa</option><option value="REJECTED">Từ chối</option><option th:if="${document.status.name() == 'APPROVED'}" value="PUBLISHED">Công bố</option></select></label><label>Góp ý<textarea th:field="*{comment}" rows="5"></textarea></label><button type="submit">Lưu kết quả</button></form><h2>Lịch sử</h2><ul><li th:each="item : ${history}" th:text="|${item.createdAt} — ${item.action}: ${item.comment ?: ''}|"></li></ul></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
