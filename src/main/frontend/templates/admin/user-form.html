<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Người dùng</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="content narrow"><h1 th:text="${userForm.id == null ? 'Thêm người dùng' : 'Sửa người dùng'}"></h1><form th:action="@{/admin/users/save}" th:object="${userForm}" method="post" class="form-grid"><input type="hidden" th:field="*{id}"><label>Họ tên<input th:field="*{fullName}" required></label><label>Email<input type="email" th:field="*{email}" required></label><label>Mật khẩu<input type="password" th:field="*{password}" th:required="${userForm.id == null}"></label><fieldset><legend>Vai trò</legend><label th:each="role : ${roleNames}"><input type="checkbox" th:field="*{roles}" th:value="${role}"><span th:text="${role}"></span></label></fieldset><label><input type="checkbox" th:field="*{enabled}"> Đang hoạt động</label><button type="submit">Lưu</button></form></main></body></html>
