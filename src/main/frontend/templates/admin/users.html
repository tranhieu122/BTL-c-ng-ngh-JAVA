<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Quản lý người dùng</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="page-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><div class="title-row"><h1>Người dùng</h1><a class="button" th:href="@{/admin/users/new}">Thêm người dùng</a></div><p class="alert success" th:if="${success}" th:text="${success}"></p><table><thead><tr><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Hoạt động</th><th></th></tr></thead><tbody><tr th:each="user : ${users}"><td th:text="${user.fullName}"></td><td th:text="${user.email}"></td><td th:text="${user.roles}"></td><td th:text="${user.enabled ? 'Có' : 'Không'}"></td><td><a th:href="@{/admin/users/{id}/edit(id=${user.id})}">Sửa</a></td></tr></tbody></table></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
