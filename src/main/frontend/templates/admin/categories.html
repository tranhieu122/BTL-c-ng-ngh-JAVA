<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Danh mục</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><div class="page-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main class="content"><h1>Danh mục tài liệu</h1><p class="alert success" th:if="${success}" th:text="${success}"></p><form th:action="@{/admin/categories}" th:object="${category}" method="post" class="inline-form"><input th:field="*{name}" placeholder="Tên danh mục" required><input th:field="*{description}" placeholder="Mô tả"><button>Thêm</button></form><table><thead><tr><th>Tên</th><th>Mô tả</th><th>Hoạt động</th><th></th></tr></thead><tbody><tr th:each="item : ${categories}"><td th:text="${item.name}"></td><td th:text="${item.description}"></td><td th:text="${item.active ? 'Có' : 'Không'}"></td><td><form th:if="${item.active}" th:action="@{/admin/categories/{id}/delete(id=${item.id})}" method="post"><button class="danger">Ngừng dùng</button></form></td></tr></tbody></table></main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
