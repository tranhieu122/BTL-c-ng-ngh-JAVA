<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside class="sidebar" th:fragment="sidebar" aria-label="Điều hướng chức năng">
    <div class="sidebar-intro">
        <span class="sidebar-kicker">EduRepo workspace</span>
        <strong>Trung tâm học liệu</strong>
    </div>

    <p class="sidebar-label">Khám phá</p>
    <a th:href="@{/repository}" data-sidebar-link aria-label="Kho công khai">
        <span class="nav-icon" aria-hidden="true">⌂</span>
        <span>Kho công khai</span>
    </a>

    <p class="sidebar-label" sec:authorize="hasAnyRole('SUBMITTER','REVIEWER','ADMIN')">Công việc</p>
    <a sec:authorize="hasAnyRole('SUBMITTER','ADMIN')" th:href="@{/documents}" data-sidebar-link aria-label="Tài liệu của tôi">
        <span class="nav-icon" aria-hidden="true">▤</span>
        <span>Tài liệu của tôi</span>
    </a>
    <a sec:authorize="hasAnyRole('SUBMITTER','ADMIN')" th:href="@{/documents/new}" data-sidebar-link aria-label="Nộp tài liệu">
        <span class="nav-icon" aria-hidden="true">＋</span>
        <span>Nộp tài liệu</span>
    </a>
    <a sec:authorize="hasAnyRole('REVIEWER','ADMIN')" th:href="@{/reviews/pending}" data-sidebar-link aria-label="Tài liệu chờ duyệt">
        <span class="nav-icon" aria-hidden="true">✓</span>
        <span>Chờ duyệt</span>
    </a>

    <p class="sidebar-label" sec:authorize="hasRole('ADMIN')">Quản trị</p>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" data-sidebar-link aria-label="Thống kê hệ thống">
        <span class="nav-icon" aria-hidden="true">⌁</span>
        <span>Thống kê</span>
    </a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}" data-sidebar-link aria-label="Quản lý người dùng">
        <span class="nav-icon" aria-hidden="true">◎</span>
        <span>Người dùng</span>
    </a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/categories}" data-sidebar-link aria-label="Quản lý danh mục">
        <span class="nav-icon" aria-hidden="true">◇</span>
        <span>Danh mục</span>
    </a>

    <div class="sidebar-note">
        <span class="sidebar-note-icon" aria-hidden="true">i</span>
        <p><strong>Quy trình rõ ràng</strong><small>Mọi thay đổi đều được lưu trong lịch sử kiểm duyệt.</small></p>
    </div>
</aside>
</body>
</html>
