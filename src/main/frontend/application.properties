# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=EduRepo
server.port=8080

# ===================================================================
# Database (MySQL) Configuration
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/document_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Development: always load the latest Thymeleaf, CSS and JavaScript files.
# This prevents old cached HTML from being combined with newly edited assets.
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# File upload and optional initial administrator
app.upload.dir=${UPLOAD_DIR:uploads}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Logging Configuration
logging.level.com.hieu.edurepo=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
