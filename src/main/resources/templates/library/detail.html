<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${collection.name + ' | EduRepo'}">Bộ sưu tập | EduRepo</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/header :: header}"></div><div class="page-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div><main id="main-content" class="content workspace-content library-page">
    <header class="workspace-heading"><div><span class="workspace-kicker">Bộ sưu tập cá nhân</span><h1 th:text="${collection.name}">Tên bộ sưu tập</h1><p class="subtitle" th:text="${collection.description ?: 'Bộ sưu tập học liệu của bạn.'}">Mô tả</p></div><div class="workspace-actions"><a class="button button-secondary" th:href="@{/library}">← Thư viện</a><form th:action="@{/library/collections/{id}/delete(id=${collection.id})}" method="post"><button class="button button-danger" type="submit" data-confirm-message="Xóa bộ sưu tập này? Tài liệu gốc vẫn được giữ nguyên.">Xóa bộ sưu tập</button></form></div></header>
    <div th:replace="~{fragments/ui :: flashMessages}"></div>
    <details class="review-card" th:open="${#fields.hasErrors('collectionForm.*')}"><summary>Sửa tên và mô tả bộ sưu tập</summary><form class="form-grid" th:action="@{/library/collections/{id}(id=${collection.id})}" th:object="${collectionForm}" method="post">
        <label><span class="field-label">Tên bộ sưu tập</span><input th:field="*{name}" required maxlength="150"><small class="field-error" th:errors="*{name}"></small></label>
        <label><span class="field-label">Mô tả</span><textarea th:field="*{description}" maxlength="500" rows="3"></textarea><small class="field-error" th:errors="*{description}"></small></label>
        <button type="submit">Lưu thay đổi</button></form></details>
    <section class="review-card"><div class="panel-heading"><div><h2>Tài liệu trong bộ sưu tập</h2><p th:text="|${#lists.size(items)} mục đã chọn|">0 mục</p></div></div><div class="saved-document-grid" th:if="${!#lists.isEmpty(items)}"><article class="saved-document-card" th:each="entry : ${items}"><span th:text="${entry.document.category != null ? entry.document.category.name : 'Học liệu'}">Danh mục</span><h3><a th:href="@{/repository/{id}(id=${entry.document.id})}" th:text="${entry.document.title}">Tài liệu</a></h3><p th:text="${entry.document.summary ?: entry.document.description}">Mô tả</p><form th:action="@{/library/collections/{collectionId}/items/{documentId}/remove(collectionId=${collection.id},documentId=${entry.document.id})}" method="post"><button class="button button-secondary" type="submit">Xóa khỏi bộ sưu tập</button></form></article></div><div class="empty-panel" th:if="${#lists.isEmpty(items)}"><h2>Bộ sưu tập đang trống</h2><p>Thêm tài liệu từ trang chi tiết học liệu.</p><a class="button" th:href="@{/repository}">Khám phá kho</a></div></section>
</main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
