<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="document-assistant" th:fragment="widget" data-document-assistant
     th:attr="data-assistant-url=@{/api/document-assistant}">
    <section class="document-assistant-panel" id="document-assistant-panel" role="dialog" data-assistant-panel
             aria-labelledby="document-assistant-title" aria-describedby="document-assistant-intro" hidden>
        <header class="document-assistant-header">
            <div class="document-assistant-identity">
                <span class="document-assistant-avatar" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M8 9h8M8 13h5m-7 6-3 2v-4.5A8 8 0 0 1 4 5.7 8 8 0 0 1 17.8 7a8 8 0 0 1 .4 8.5A8 8 0 0 1 11 20H6Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <i></i>
                </span>
                <div>
                    <span class="document-assistant-kicker">Trợ lý học liệu</span>
                    <h2 id="document-assistant-title">EduBot</h2>
                    <p><span aria-hidden="true"></span> Sẵn sàng hỗ trợ</p>
                </div>
            </div>
            <div class="document-assistant-header-actions">
                <button class="document-assistant-icon-button" type="button" aria-label="Xóa nội dung hội thoại"
                        title="Xóa hội thoại" data-assistant-clear>
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M9 11v6m6-6v6M9 7l1-2h4l1 2m3 0-1 13H7L6 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button class="document-assistant-icon-button document-assistant-close" type="button"
                        aria-label="Đóng trợ lý tra cứu tài liệu" data-assistant-close>
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>
        </header>

        <div class="document-assistant-conversation" data-assistant-messages role="log"
             aria-live="polite" aria-relevant="additions">
            <div class="assistant-message-row assistant-message-row-system" id="document-assistant-intro"
                 data-assistant-welcome>
                <span class="assistant-message-avatar" aria-hidden="true">E</span>
                <div>
                    <div class="assistant-message assistant-message-system">
                        <strong>Xin chào! Mình là EduBot 👋</strong>
                        <span>Mình có thể giúp bạn tìm nhanh tài liệu theo tên, chủ đề hoặc lĩnh vực.</span>
                    </div>
                    <time>Vừa xong</time>
                </div>
            </div>
            <div class="assistant-suggestions" data-assistant-suggestions aria-label="Câu hỏi gợi ý">
                <p>Bạn có thể thử</p>
                <div>
                    <button type="button" data-assistant-suggestion="Hiện có những tài liệu nào?">Tài liệu mới nhất</button>
                    <button type="button" data-assistant-suggestion="Tìm tài liệu về Spring Boot">Spring Boot</button>
                    <button type="button" data-assistant-suggestion="Tìm tài liệu về cơ sở dữ liệu">Cơ sở dữ liệu</button>
                </div>
            </div>
        </div>

        <div class="document-assistant-loading" data-assistant-loading role="status" hidden>
            <span class="assistant-message-avatar" aria-hidden="true">E</span>
            <span class="assistant-typing" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="assistant-sr-only">EduBot đang tìm tài liệu…</span>
        </div>

        <div class="document-assistant-composer">
            <form class="document-assistant-form" data-assistant-form>
                <label class="assistant-sr-only" for="document-assistant-input">Tên hoặc chủ đề tài liệu cần tìm</label>
                <textarea id="document-assistant-input" name="message" rows="1" maxlength="200"
                          autocomplete="off" placeholder="Hỏi EduBot về tài liệu bạn cần…"
                          data-assistant-input></textarea>
                <button type="submit" data-assistant-submit aria-label="Gửi yêu cầu tìm tài liệu" disabled>
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12 14-7-4 14-3.5-5.5L5 12Zm6.5 1.5L19 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </form>
            <div class="document-assistant-composer-meta">
                <span>Enter để gửi · Shift + Enter để xuống dòng</span>
                <span><b data-assistant-count>0</b>/200</span>
            </div>
        </div>
    </section>

    <button class="document-assistant-trigger" type="button" aria-expanded="false"
            aria-controls="document-assistant-panel" aria-label="Mở trợ lý tra cứu tài liệu"
            data-assistant-open>
        <span class="document-assistant-trigger-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M8 9h8M8 13h5m-7 6-3 2v-4.5A8 8 0 0 1 4 5.7 8 8 0 0 1 17.8 7a8 8 0 0 1 .4 8.5A8 8 0 0 1 11 20H6Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="document-assistant-trigger-copy"><strong>Hỏi EduBot</strong><small>Tìm học liệu nhanh</small></span>
        <i class="document-assistant-trigger-status" aria-hidden="true"></i>
    </button>
</div>
</body>
</html>
