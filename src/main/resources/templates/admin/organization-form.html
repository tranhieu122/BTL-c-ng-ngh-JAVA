<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cập nhật cơ cấu | EduRepo</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div th:replace="~{fragments/header :: header}"></div><div class="page-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main id="main-content" class="content workspace-content">
    <header class="workspace-heading"><div><span class="workspace-kicker">Cấu trúc đào tạo</span><h1 th:text="${editingFaculty} ? 'Cập nhật khoa' : 'Cập nhật bộ môn'">Cập nhật</h1><p class="subtitle">Thay đổi này được áp dụng cho các lựa chọn nộp tài liệu trong tương lai.</p></div><div class="workspace-actions"><a class="button button-secondary" th:href="@{/admin/organization}">Quay lại</a></div></header>
    <section class="form-layout" th:if="${editingFaculty}"><form class="form-card" th:action="@{/admin/organization/faculties/{id}(id=${faculty.id})}" th:object="${faculty}" method="post"><div class="form-section-heading"><h2>Thông tin khoa</h2></div><label><span class="field-label">Tên khoa</span><input th:field="*{name}" required><small class="field-error" th:errors="*{name}"></small></label><label><span class="field-label">Mô tả</span><textarea th:field="*{description}" rows="5"></textarea><small class="field-error" th:errors="*{description}"></small></label><div class="form-submit-row"><button type="submit">Lưu thay đổi</button></div></form><aside class="form-card"><div class="form-section-heading"><h2>Tác động dữ liệu</h2></div><dl class="metadata-grid"><div><dt>Bộ môn trực thuộc</dt><dd th:text="${departmentCount}">0</dd></div><div><dt>Tài liệu liên quan</dt><dd th:text="${documentCount}">0</dd></div></dl></aside></section>
    <section class="form-layout" th:if="${editingDepartment}"><form class="form-card" th:action="@{/admin/organization/departments/{id}(id=${department.id})}" th:object="${department}" method="post"><div class="form-section-heading"><h2>Thông tin bộ môn</h2></div><label><span class="field-label">Khoa trực thuộc</span><select th:field="*{faculty.id}" required><option value="">Chọn khoa</option><option th:each="item : ${activeFaculties}" th:value="${item.id}" th:text="${item.name}"></option></select><small class="field-error" th:errors="*{faculty}"></small></label><label><span class="field-label">Tên bộ môn</span><input th:field="*{name}" required><small class="field-error" th:errors="*{name}"></small></label><label><span class="field-label">Mô tả</span><textarea th:field="*{description}" rows="5"></textarea><small class="field-error" th:errors="*{description}"></small></label><div class="form-submit-row"><button type="submit">Lưu thay đổi</button></div></form><aside class="form-card"><div class="form-section-heading"><h2>Tác động dữ liệu</h2></div><dl class="metadata-grid"><div><dt>Tài liệu thuộc bộ môn</dt><dd th:text="${documentCount}">0</dd></div></dl></aside></section>
</main></div><div th:replace="~{fragments/footer :: footer}"></div></body></html>
