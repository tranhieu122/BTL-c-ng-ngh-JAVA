<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Khoa và bộ môn | EduRepo</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="page-shell"><div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main id="main-content" class="content workspace-content organization-page">
    <header class="workspace-heading"><div><span class="workspace-kicker">Cấu trúc đào tạo</span><h1>Khoa và bộ môn</h1><p class="subtitle">Thiết lập cơ cấu dùng nhất quán cho hồ sơ tài liệu và thống kê.</p></div></header>
    <div th:replace="~{fragments/ui :: flashMessages}"></div>
    <form class="document-filter-panel" method="get" th:action="@{/admin/organization}"><label><span class="field-label">Tên khoa hoặc bộ môn</span><input type="search" name="keyword" th:value="${keyword}"></label><label><span class="field-label">Trạng thái</span><select name="active"><option value="">Tất cả</option><option value="true" th:selected="${selectedActive == true}">Đang dùng</option><option value="false" th:selected="${selectedActive == false}">Ngừng dùng</option></select></label><button type="submit">Lọc</button><a th:href="@{/admin/organization}">Xóa lọc</a></form>
    <div class="organization-forms">
        <section class="form-card"><div class="form-section-heading"><h2>Thêm khoa</h2></div><form th:action="@{/admin/organization/faculties}" th:object="${faculty}" method="post" class="form-grid"><label><span class="field-label">Tên khoa</span><input th:field="*{name}" required><small class="field-error" th:errors="*{name}"></small></label><label><span class="field-label">Mô tả</span><textarea th:field="*{description}" rows="3"></textarea></label><button type="submit">Thêm khoa</button></form></section>
        <section class="form-card"><div class="form-section-heading"><h2>Thêm bộ môn</h2></div><form th:action="@{/admin/organization/departments}" th:object="${department}" method="post" class="form-grid"><label><span class="field-label">Thuộc khoa</span><select th:field="*{faculty.id}" required><option value="">Chọn khoa</option><option th:each="item : ${activeFaculties}" th:value="${item.id}" th:text="${item.name}"></option></select><small class="field-error" th:errors="*{faculty}"></small></label><label><span class="field-label">Tên bộ môn</span><input th:field="*{name}" required><small class="field-error" th:errors="*{name}"></small></label><label><span class="field-label">Mô tả</span><textarea th:field="*{description}" rows="3"></textarea></label><button type="submit">Thêm bộ môn</button></form></section>
    </div>
<section class="workspace-grid organization-tables"><article class="data-panel"><div class="data-panel-header"><strong>Khoa</strong><span class="record-count" th:text="|${#lists.size(faculties)} khoa|"></span></div><div class="table-scroll"><table class="data-table faculty-table"><thead><tr><th>Tên khoa</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="item : ${faculties}"><td><strong th:text="${item.name}"></strong><small class="field-hint" th:text="${item.description}"></small></td><td><span class="status-pill" th:classappend="${item.active} ? ' is-active' : ''" th:text="${item.active ? 'Đang dùng' : 'Ngừng'}"></span></td><td><div class="organization-actions"><a class="table-action" th:href="@{/admin/organization/faculties/{id}/edit(id=${item.id})}">Sửa</a><form th:action="@{/admin/organization/faculties/{id}/disable(id=${item.id})}" method="post"><button type="submit" class="button button-warning button-sm" th:text="${item.active ? 'Ngừng dùng' : 'Kích hoạt'}"></button></form></div></td></tr></tbody></table></div></article><article class="data-panel"><div class="data-panel-header"><strong>Bộ môn</strong><span class="record-count" th:text="|${#lists.size(departments)} bộ môn|"></span></div><div class="table-scroll"><table class="data-table department-table"><thead><tr><th>Bộ môn</th><th>Khoa</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="item : ${departments}"><td th:text="${item.name}"></td><td th:text="${item.faculty != null ? item.faculty.name : 'Chưa gán'}"></td><td><span class="status-pill" th:classappend="${item.active} ? ' is-active' : ''" th:text="${item.active ? 'Đang dùng' : 'Ngừng'}"></span></td><td><div class="organization-actions"><a class="table-action" th:href="@{/admin/organization/departments/{id}/edit(id=${item.id})}">Sửa</a><form th:action="@{/admin/organization/departments/{id}/disable(id=${item.id})}" method="post"><button type="submit" class="button button-warning button-sm" th:text="${item.active ? 'Ngừng dùng' : 'Kích hoạt'}"></button></form></div></td></tr></tbody></table></div></article></section>
</main></div><div th:replace="~{fragments/footer :: footer}"></div>
</body></html>
