# Production values must be supplied through environment variables or the host platform.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.baseline-on-migrate=false
spring.thymeleaf.cache=true
spring.web.resources.cache.period=3600
spring.web.resources.chain.cache=true
spring.jpa.show-sql=false
logging.level.com.hieu.edurepo=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# Demo defaults are disabled. Supply both APP_ADMIN_EMAIL and APP_ADMIN_PASSWORD only to create the first admin.
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.user.email=
app.user.password=
