# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=EduRepo
server.port=8081

# ===================================================================
# Database (MySQL) Configuration
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/document_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Development: always load the latest Thymeleaf, CSS and JavaScript files.
# This prevents old cached HTML from being combined with newly edited assets.
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# File upload and optional initial administrator
app.upload.dir=${UPLOAD_DIR:uploads}
app.admin.email=${APP_ADMIN_EMAIL:admin@edurepo.local}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123456}
app.user.email=${APP_USER_EMAIL:user@edurepo.local}
app.user.password=${APP_USER_PASSWORD:User@123456}
spring.servlet.multipart.max-file-size=200MB
# Multipart headers also count toward the request limit.
spring.servlet.multipart.max-request-size=201MB

# Logging Configuration
logging.level.com.hieu.edurepo=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
