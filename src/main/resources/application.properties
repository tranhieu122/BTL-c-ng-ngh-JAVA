spring.application.name=EduRepo
spring.profiles.default=dev
server.port=8080

# Cookie-based MVC sessions. Production overrides Secure because local development uses HTTP.
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# Server-rendered time shown in the shared interface.
app.time.zone=${APP_TIME_ZONE:Asia/Ho_Chi_Minh}
app.time.display-format=${APP_TIME_DISPLAY_FORMAT:dd/MM/yyyy HH:mm}

# Schema changes are owned by Flyway. Hibernate only checks entity mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Stable across working directories. run-web.bat overrides this with the
# absolute project uploads directory so existing files remain available.
app.upload.dir=${UPLOAD_DIR:${user.home}/.edurepo/uploads}
app.upload.max-file-size-bytes=${UPLOAD_MAX_FILE_SIZE_BYTES:209715200}
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=201MB

# Authenticated SSE snapshots; every reconnect sends current database state.
app.realtime.interval-ms=${REALTIME_INTERVAL_MS:2000}
# Periodic fallback catches changes made outside this application or by another instance.
app.realtime.safety-refresh-ms=${REALTIME_SAFETY_REFRESH_MS:30000}

# Temporarily block new logins after repeated invalid passwords.
app.security.login.max-failures=${LOGIN_MAX_FAILURES:5}
app.security.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}

# OTP email delivery. For Gmail, use an App Password, not your normal password.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT_MS:5000}
app.auth.otp.ttl-minutes=${OTP_TTL_MINUTES:10}
app.auth.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.auth.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
# Safe convenience value for dev/test only. application-prod.properties overrides it and
# OtpProductionConfiguration rejects missing or weak production values at startup.
app.auth.otp.pepper=${OTP_HASH_PEPPER:dev-only-not-for-production}

# Only minimal health responses are public; SecurityConfig protects all management endpoints.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.show-details=never
management.endpoint.health.group.liveness.show-components=never
management.endpoint.health.group.readiness.include=readinessState,db,diskSpace
management.endpoint.health.group.readiness.show-details=never
management.endpoint.health.group.readiness.show-components=never
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.diskspace.path=${app.upload.dir}
management.health.diskspace.threshold=1GB
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true

# Correlate server logs with the safe request ID returned to the client.
logging.pattern.level=%5p [requestId:%X{requestId:-}]

# ==============================================================================
# OpenAI LLM & Embedding Model Configuration
# ==============================================================================
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.6-luna}
openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:45}

# ==============================================================================
# RAG (Retrieval-Augmented Generation) Pipeline Configuration
# ==============================================================================
rag.enabled=${RAG_ENABLED:true}
rag.top-k=${RAG_TOP_K:5}
rag.chunk-size=${RAG_CHUNK_SIZE:600}
rag.chunk-overlap=${RAG_CHUNK_OVERLAP:100}
rag.similarity-threshold=${RAG_SIMILARITY_THRESHOLD:0.45}
rag.max-context-tokens=${RAG_MAX_CONTEXT_TOKENS:3000}
