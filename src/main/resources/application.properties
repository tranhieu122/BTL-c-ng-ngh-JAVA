spring.application.name=EduRepo
spring.profiles.default=dev
server.port=8080

# Server-rendered time shown in the shared interface.
app.time.zone=${APP_TIME_ZONE:Asia/Ho_Chi_Minh}
app.time.display-format=${APP_TIME_DISPLAY_FORMAT:dd/MM/yyyy HH:mm}

# Schema changes are owned by Flyway. Hibernate only checks entity mappings.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Stable across working directories. run-web.bat overrides this with the
# absolute project uploads directory so existing files remain available.
app.upload.dir=${UPLOAD_DIR:${user.home}/.edurepo/uploads}
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=201MB

# Authenticated SSE snapshots; every reconnect sends current database state.
app.realtime.interval-ms=${REALTIME_INTERVAL_MS:2000}

# Temporarily block new logins after repeated invalid passwords.
app.security.login.max-failures=${LOGIN_MAX_FAILURES:5}
app.security.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}

# OTP email delivery. For Gmail, use an App Password, not your normal password.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.auth.otp.ttl-minutes=${OTP_TTL_MINUTES:10}
app.auth.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.auth.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.auth.otp.pepper=${OTP_HASH_PEPPER:${spring.application.name}}

# Only a minimal health response is public; other Actuator endpoints require ADMIN.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.diskspace.path=${app.upload.dir}
management.health.diskspace.threshold=1GB
