# Local development only: convenient defaults and disabled template/resource caches.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/document_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.baseline-on-migrate=true
# Existing databases created before Flyway are treated as the V1 schema.
spring.flyway.baseline-version=1
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.jpa.show-sql=false
logging.level.com.hieu.edurepo=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
# Used only when these accounts do not already exist.
app.admin.email=${APP_ADMIN_EMAIL:admin@edurepo.local}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123456}
app.user.email=${APP_USER_EMAIL:user@edurepo.local}
app.user.password=${APP_USER_PASSWORD:User@123456}
